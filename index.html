<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="side-image-container">
            <img src="images/plant.jpg" class="plant-image">
            <div class="odin-logo-container">
                <img src="images/odin-lined.png" class="odin-logo">
                <h1>ODIN</h1>
            </div>
            
        </div>
        <div class="form-container">
            <h3>This not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</h3>
            <h3>You <em>know</em> you want to.</h3>
            
            <form action="#" method="post">
                
                <div class="for-background">
                    <h3>Let's do this!</h3>
                    <div class="input-section">
                        <div class="firstname elements">
                            <label for="firstname" id="firstname">FIRST NAME</label>
                            <input type="text" placeholder="Enter yor first name" required>
                        </div>
                        <div class="lastname elements">
                            <label for="lastname" id="lastname">LAST NAME</label>
                            <input type="text" placeholder="Enter yor last name" required>
                        </div>
                        <div class="email elements">
                            <label for="email" id="email">EMAIL</label>
                            <input type="email" placeholder="Enter yor email address" required>
                        </div>
                        <div class="phonenumber elements">
                            <label for="phonenumber" id="phonenumber">PHONE NUMBER</label>
                            <input type="number" placeholder="Enter your phone number" required>
                        </div>
                        <div class="password elements">
                            <label for="password" id="password">PASSWORD</label>
                            <input type="password" placeholder="Enter your password" required>
                        </div>
                        <div class="confirm-password elements">
                            <label for="confirm-password" id="password">CONFIRM PASSWORD</label>
                            <input type="password" placeholder="Enter your password" required>
                        </div>
                    </div>
                </div>
                

                <button type="submit" class="submit-btn">Create Account</button>

                <p class="login-btn">Already have an account? <a href="#">Login</a></p>
                
            </form>
        </div>
    </div>
</body>
</html>
